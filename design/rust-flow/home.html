<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EditorKrab · โปรเจกต์</title>
<style>
/* tokens match index.html; the project screen is the app's first page */
:root{color-scheme:dark;
--h:258;
--bg:oklch(20% .035 var(--h));--surface:#17243B;--raised:oklch(31% .05 var(--h));--sunken:oklch(16.5% .03 var(--h));
--line:oklch(35% .045 var(--h));--line-strong:oklch(45% .045 var(--h));
--txt:oklch(95% .006 var(--h));--txt-sub:oklch(82% .01 var(--h));--mut:oklch(66% .012 var(--h));
--acc:#FF785C;--acc-hover:oklch(78% .15 36);--acc-soft:rgb(255 120 92 / .16);--on-acc:#17243B;--focus:var(--acc);
--danger:oklch(68% .19 25);
--radius:10px;--radius-sm:7px;--space-xs:4px;--space-sm:8px;--space-md:12px;--space-lg:16px;--space-xl:24px;--space-2xl:32px;
--ease:cubic-bezier(.22,1,.36,1)}
:root[data-theme=light]{color-scheme:light;
--bg:oklch(97.5% .004 var(--h));--surface:oklch(99.2% .002 var(--h));--raised:oklch(95% .006 var(--h));--sunken:oklch(93.5% .007 var(--h));
--line:oklch(89% .008 var(--h));--line-strong:oklch(78% .01 var(--h));
--txt:oklch(22% .012 var(--h));--txt-sub:oklch(38% .012 var(--h));--mut:oklch(50% .012 var(--h));
--acc-hover:oklch(68% .18 36);--acc-soft:rgb(255 120 92 / .14);--focus:oklch(55% .17 38);--danger:oklch(53% .19 25)}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--txt);font:.9375rem/1.55 "Segoe UI","Leelawadee UI",Tahoma,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit;min-height:44px;border:1px solid var(--line);border-radius:var(--radius-sm);padding:var(--space-sm) var(--space-md)}
button{cursor:pointer;background:var(--surface);transition:background-color .18s var(--ease),border-color .18s var(--ease)}
button:hover{border-color:var(--line-strong);background:var(--raised)}
button.primary{background:var(--acc);border-color:var(--acc);color:var(--on-acc);font-weight:600}
button.primary:hover{background:var(--acc-hover);border-color:var(--acc-hover)}
button:disabled{cursor:default;opacity:.6}
input{background:var(--sunken);min-width:0}
input::placeholder{color:var(--mut)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.topbar{border-bottom:1px solid var(--line);background:var(--sunken)}
.topbar-inner,.page{width:min(920px,100% - 32px);margin-inline:auto}
.topbar-inner{display:flex;align-items:center;min-height:56px}
.brand{display:flex;align-items:center;gap:var(--space-sm);font-weight:700;letter-spacing:-.02em;color:inherit;text-decoration:none}.brand svg{color:var(--acc)}
.page{padding:var(--space-2xl) 0 64px}
h1{margin:0 0 var(--space-xl);font-size:1.5rem;line-height:1.25;letter-spacing:-.01em}
.create-error{margin:0 0 var(--space-lg);color:var(--danger);font-size:.875rem}
#projects{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(208px,1fr));gap:var(--space-xl) var(--space-lg)}
.project,.new{display:grid;gap:var(--space-sm);align-content:start;color:inherit;text-decoration:none;border-radius:var(--radius);min-height:0;padding:0;border:0;background:none;text-align:left;width:100%}
.thumb{position:relative;aspect-ratio:16/9;border-radius:var(--radius);background:var(--sunken);overflow:hidden;display:grid;place-items:center;color:var(--mut);outline:1px solid var(--line);outline-offset:-1px;transition:outline-color .18s var(--ease)}
.thumb video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.project:hover .thumb{outline:2px solid var(--line-strong)}
.new .thumb{background:var(--acc-soft);color:var(--acc);outline:1.5px dashed var(--acc);gap:var(--space-xs);font-weight:600}
.new:hover .thumb{background:rgb(255 120 92 / .24)}
.new:hover{background:none}
.new:disabled .thumb{opacity:.6}
.name{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-inline:2px}
.name[data-untitled]{color:var(--txt-sub);font-weight:500}
.meta{display:block;color:var(--mut);font-size:.8125rem;font-variant-numeric:tabular-nums;padding-inline:2px;margin-top:-4px}
.state{padding:var(--space-xl) 0;color:var(--mut)}
.state button{margin-left:var(--space-sm)}
.skeleton{display:grid;gap:var(--space-sm)}.skeleton i{display:block;background:var(--raised);border-radius:var(--radius)}.skeleton i:first-child{aspect-ratio:16/9}.skeleton i:last-child{height:12px;width:60%;border-radius:6px}
@media (max-width:560px){#projects{grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-lg) var(--space-md)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="topbar"><div class="topbar-inner">
<a class="brand" href="/"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="4"/><path d="m10 9 5 3-5 3Z"/></svg>EditorKrab</a>
</div></header>
<main class="page">
<h1>โปรเจกต์</h1>
<p class="create-error" id="createError" role="alert" hidden></p>
<ul id="projects" aria-label="โปรเจกต์">
<li><button type="button" class="new" id="create"><span class="thumb"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>โปรเจกต์ใหม่</span><span class="meta">ใส่วิดีโอได้กี่ตัวก็ได้</span></button></li>
<li class="skeleton" aria-hidden="true"><i></i><i></i></li><li class="skeleton" aria-hidden="true"><i></i><i></i></li>
</ul>
<p id="state" class="state" role="status" hidden></p>
</main>
<script>try{const t=localStorage.getItem("editorkrab-theme");if(t)document.documentElement.dataset.theme=t}catch{}</script>
<script type="module" src="home.js"></script>
</body>
</html>
