name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install ffmpeg
        run: choco install ffmpeg -y --no-progress
      - name: Build and test the Rust app
        run: |
          cargo build --manifest-path rust/Cargo.toml --locked
          cargo test --manifest-path rust/Cargo.toml --locked
      - name: Page script tests
        shell: pwsh
        run: |
          $failed = @()
          foreach ($t in Get-ChildItem scripts -Include *_test.js, *_test.cjs -Recurse) {
            Write-Host "== $($t.Name)"
            node $t.FullName
            if ($LASTEXITCODE -ne 0) { $failed += $t.Name }
          }
          if ($failed) { throw "failed: $($failed -join ', ')" }

  macos:
    name: Mac (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build and test the Rust app
        run: |
          cargo build --manifest-path rust/Cargo.toml --locked
          cargo test --manifest-path rust/Cargo.toml --locked
      - name: Page script tests
        run: |
          failed=0
          while IFS= read -r test; do
            echo "== $test"
            node "$test" || failed=1
          done < <(find scripts -type f \( -name '*_test.js' -o -name '*_test.cjs' \))
          exit "$failed"
