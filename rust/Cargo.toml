[package]
name = "editorkrab"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "process", "io-util", "sync", "fs"] }
async-stream = "0.3"
futures-core = "0.3"
rfd = { version = "0.17", default-features = false }
uuid = { version = "1", features = ["v4"] }


sha2 = "0.10"
nlpo3 = "1.4.0"
sherpa-onnx = "1.13.8"
