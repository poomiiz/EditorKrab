<!DOCTYPE html>
<html lang="th" data-resolution="portrait">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<!--
  ClipKit motion stock - level 0 "hook title" (first 3-5 s of a clip).
  Set HOOK below. STYLE "tilt" (from a hand-made edit): red keyword DB Heavent size 58 x0.84 tilt -4 deg,
  white stroke, neon-flicker entrance ("มิดไนท์คลับ" 0.5 s), white sub-line types in 0.83 s later.
  STYLE "straight": white context line on top, red answer below, no tilt.
  Transparent background for a CapCut overlay; preview over footage with ?bg=<image>.
-->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  #root { position: absolute; inset: 0; }
  #bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .hook { position: absolute; left: 0; right: 0; top: 0; height: 1920px; opacity: 0; }
  .line { position: absolute; left: 50%; white-space: nowrap; font-weight: 700; text-align: center; line-height: 1.2; }
  .key { -webkit-text-stroke: 18px #fff; paint-order: stroke fill; filter: drop-shadow(0 6px 10px rgba(0,0,0,.45)); }
  .glow { position: absolute; inset: 0; color: transparent; -webkit-text-stroke: 4px var(--c, #fff); }
  .sub { color: #fff; text-shadow: 0 0 2px rgba(0,0,0,.6), 0 4px 10px rgba(0,0,0,.6); }
  .cur { display: inline-block; width: 5px; margin-left: 6px; background: #fff; vertical-align: -0.12em; height: 0.9em; }
</style>
<!-- ClipKit motion page reads this: label, the form fields, and how the clip length is found
     ("duration" field, or "pairs" = end of the last pair). Copy this block into a new template. -->
<script type="application/json" id="clipkit-motion">
{"role": "หัวคลิป", "mood": "ตื่นเต้น", "label": "หัวคลิป · คำเด่น + คำรอง (3–5 วินาทีแรก)", "length": "duration",
   "fields": [{"key": "key", "label": "คำเด่น", "type": "text", "default": "Burn out"},
              {"key": "sub", "label": "คำรอง", "type": "text", "default": "เพราะพลาดเรื่องนี้"},
              {"key": "style", "label": "สไตล์", "type": "select", "default": "tilt",
               "options": [["tilt", "แดงเอียง ไฟนีออน"], ["straight", "ขาวบน แดงล่าง"]]},
              {"key": "duration", "label": "ยาว (วินาที)", "type": "number", "default": 5.5},
              {"key": "font", "label": "ฟอนต์", "type": "font", "default": ""}]}
</script>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="5.5" data-width="1080" data-height="1920">
  <img id="bg" class="clip" data-start="0" data-duration="5.5" data-track-index="0" alt="" style="display:none">
</div>
<script>
  // values come from ?key=... in the preview URL, or window.KIT injected by the ClipKit app before render
  const ARGS = { ...Object.fromEntries(new URLSearchParams(location.search)), ...(window.KIT || {}) };
  const HOOK = { key: ARGS.key ?? "Burn out", sub: ARGS.sub ?? "เพราะพลาดเรื่องนี้", duration: parseFloat(ARGS.duration) || 5.5 };
  const STYLE = (ARGS.style || "tilt");
  if (!(STYLE in { tilt: 1, straight: 1 })) throw new Error("unknown style: " + STYLE);
  // SPEED 2 = every entrance twice as fast as the original CapCut edit (the original felt slow); ?speed= overrides
  const SPEED = Math.max(parseFloat(ARGS.speed) || 2, 1.6 / HOOK.duration);

  const STYLES = {
    tilt: { font: '"DB Heavent", "Sukhumvit Set", sans-serif', tilt: -4.3,
            key: { color: "rgb(236,29,29)", size: 250, top: 1150, order: 0 },
            sub: { size: 122, top: 1405, delay: 0.83 }, keyIn: "neon" },
    straight: { font: '"Sukhumvit Set", "DB Heavent", sans-serif', tilt: 0,
            key: { color: "rgb(237,28,28)", size: 150, top: 1265, order: 1 },
            sub: { size: 86, top: 1150, delay: 0 }, keyIn: "smear" },
  };
  const S = STYLES[STYLE];
  const TYPE = 0.5 / SPEED, NEON = 0.5 / SPEED, SUB_DELAY = S.sub.delay / SPEED;

  const bg = ARGS.bg;
  const root = document.getElementById("root");
  root.dataset.duration = HOOK.duration; document.getElementById("bg").dataset.duration = HOOK.duration;
  if (bg) { const im = document.getElementById("bg"); im.src = bg; im.style.display = "block"; }

  const seg = (s) => [...new Intl.Segmenter("th", { granularity: "grapheme" }).segment(s)].map(x => x.segment);
  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
  const h = document.createElement("div");
  h.className = "hook clip"; h.dataset.start = 0; h.dataset.duration = HOOK.duration; h.dataset.trackIndex = 1;
  // ?font= / KIT.font: any font installed on this machine, the style font stays as fallback
  h.style.fontFamily = ARGS.font ? `"${ARGS.font}", ${S.font}` : S.font;
  h.innerHTML = `
    <div class="line key" style="top:${S.key.top}px;font-size:${S.key.size}px;color:${S.key.color}">
      <span class="solid">${esc(HOOK.key)}</span><span class="glow" data-layout-ignore aria-hidden="true">${esc(HOOK.key)}</span></div>
    <div class="line sub" style="top:${S.sub.top}px;font-size:${S.sub.size}px">
      <span class="sub-text">${esc(HOOK.sub)}</span><span class="cur" data-layout-ignore aria-hidden="true" style="pointer-events:none"></span></div>`;
  root.appendChild(h);

  const key = h.querySelector(".key"), solid = key.querySelector(".solid"), glow = key.querySelector(".glow");
  const sub = h.querySelector(".sub"), cur = sub.querySelector(".cur"), subText = sub.querySelector('.sub-text'), chars = seg(HOOK.sub);
  const layout = ARGS.layout;
  [key, sub].forEach(node => node.setAttribute('data-motion-box', ''));
  const check = layout ? window.clipkitMotionLayout(h, layout) : null;
  // a wide font or a long word must not run off the 1080 px frame: shrink the line to 960 px (60 px margin)
  const base = new Map([[key, S.key.size], [sub, S.sub.size]]);   // the style's own sizes (inline px)
  const fit = () => { if (layout) {
    key.style.fontSize = `${layout.font_sizes.key * layout.scale}px`; sub.style.fontSize = `${layout.font_sizes.sub * layout.scale}px`; return;
  } for (const [el, size] of base) {
    el.style.fontSize = size + "px";
    const w = el.offsetWidth;
    if (w > 960) el.style.fontSize = size * 960 / w + "px";
  } };
  fit(); if (!layout) document.fonts.ready.then(fit);
  const tl = gsap.timeline({ paused: true });
  const scaled = value => layout ? window.clipkitMotionScaleCss(value) : value;
  // both lines share the tilt; -50% keeps them centred on the frame
  gsap.set([key, sub], { xPercent: -50, rotation: S.tilt, transformOrigin: "50% 50%" });

  tl.set(h, { opacity: 1 }, 0);
  if (S.keyIn === "neon") {
    // neon flicker: coloured outline blinks through blue -> green -> pink, then the solid red title lands
    gsap.set(solid, { opacity: 0 });
    ["#4fc3ff", "#39ff88", "#ff6fd8", "#9dff6a", "#bdfcff"].forEach((c, i) =>
      tl.set(glow, { "--c": c, opacity: i % 2 ? 0.55 : 1, textShadow: scaled(`0 0 18px ${c}, 0 0 40px ${c}`) }, i * NEON / 5));
    tl.set(glow, { opacity: 0 }, NEON);
    tl.set(solid, { opacity: 1 }, NEON);
    tl.fromTo(key, { scale: 1.08 }, { scale: 1, duration: 0.18 / SPEED, ease: "power2.out" }, NEON);
  } else {
    gsap.set(glow, { opacity: 0 });
    tl.fromTo(key, { opacity: 0, x: -160 * (layout?.scale || 1), scaleX: 1.9, filter: scaled("blur(10px)") },
                   { opacity: 1, x: 0, scaleX: 1, filter: scaled("blur(0px) drop-shadow(0 6px 10px rgba(0,0,0,.45))"), duration: 0.17 / SPEED, ease: "power2.out" },
                   S.key.order ? 0.6 / SPEED : 0);
  }
  // sub-line types in one grapheme at a time (display toggles: same picture at any seek time)
  const typed = { count: 0 };
  subText.textContent = '';
  tl.fromTo(typed, { count: 0 }, { count: chars.length, duration: TYPE, ease: 'none',
    onUpdate: () => { subText.textContent = chars.slice(0, Math.floor(typed.count)).join(''); } }, SUB_DELAY);
  tl.set(cur, { opacity: 0 }, SUB_DELAY + TYPE + 0.2 / SPEED);
  tl.set(h, { opacity: 0 }, HOOK.duration);
  if (check) tl.eventCallback('onUpdate', check);

  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
</script>
</body>
</html>
