<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ตัดต่อ · EditorKrab</title>
<style>
:root{/* page aliases for the shared EditorKrab tokens in shell.css */--bg:var(--ek-bg);--card:var(--ek-surface);--card2:var(--ek-surface-2);--line:var(--ek-line);--txt:var(--ek-text);--sub:var(--ek-text-2);--mut:var(--ek-muted);--acc:var(--ek-accent);--acc-ink:var(--ek-accent-ink);--ok:var(--ek-ok);--warn:var(--ek-warn);--bad:var(--ek-danger)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:13.5px/1.6 var(--ui-font)}
main{display:grid;grid-template-rows:auto 1fr auto;height:100vh;min-width:0}
button{background:var(--card2);color:var(--sub);border:1px solid var(--line);border-radius:7px;padding:5px 12px;min-height:30px;font:inherit;font-weight:500;cursor:pointer}
button:hover{border-color:var(--acc);color:var(--txt)}
button.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:650}
button.pri:hover{background:var(--ek-accent-hover);color:var(--acc-ink)}
button:disabled{opacity:.5;cursor:wait}
input,select{accent-color:var(--acc);background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font:inherit}
.top{display:flex;gap:6px;align-items:center;padding:8px 14px;min-height:48px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.top button,.ck-dlg .ck-dlg-row button{min-height:44px}
.top h1{font-size:14.5px;font-weight:600;margin:0 8px 0 0;flex:1;min-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mid{display:grid;grid-template-columns:minmax(260px,1fr) minmax(320px,380px);gap:10px;padding:10px;min-height:0}
.player{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;background:#000;border-radius:10px;position:relative}
.player hyperframes-player{border-radius:10px;overflow:hidden}
.player .empty{position:absolute;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--mut);text-align:center;padding:30px}
.side{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow:auto;min-height:0}
.side h3{margin:0 0 8px;font-size:14px;font-weight:600}.side h4{margin:16px 0 6px;font-size:11.5px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--mut)}
.hint{color:var(--mut);font-size:12.5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.row label{min-width:86px;color:var(--sub)}
.row input[type=range]{flex:1}
#pl,#pp,#po,#pq,#pc,#ps,#pm,#pcut{min-height:44px}
.looks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.look{border:2px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;background:#000;padding:0;text-align:center}
.look img{width:100%;display:block;aspect-ratio:9/16;object-fit:cover}
.look span{display:block;font-size:12px;padding:4px;color:var(--sub);background:var(--card2)}
.look.on{border-color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;cursor:pointer;border:2px solid transparent}
.grid img:hover{border-color:var(--acc)}
/* timeline */
.tl{border-top:1px solid var(--line);background:var(--card);padding:6px 14px 10px;user-select:none}
.tlbar{display:flex;gap:10px;align-items:center;margin-bottom:6px;font-size:13px;color:var(--sub)}
.tlbar .t{font-variant-numeric:tabular-nums;color:var(--txt);min-width:110px}
.tracks{display:grid;grid-template-columns:84px 1fr;gap:8px;align-items:start}
.lab{font-size:11.5px;color:var(--mut);white-space:nowrap;height:38px;margin-top:4px;display:flex;align-items:center}
.lane{position:relative;height:38px;background:var(--card2);border-radius:6px;overflow:hidden}
.scroll{overflow-x:auto;position:relative;padding-bottom:4px}
.inner{position:relative}
.ruler{height:18px;position:relative;font-size:10.5px;color:var(--mut)}
.ruler i{position:absolute;top:0;border-left:1px solid var(--line);height:18px;padding-left:3px;font-style:normal}
.blk{position:absolute;top:3px;bottom:3px;border-radius:5px;padding:2px 6px;font-size:11.5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;border:1px solid transparent}
.blk.sub{background:#2d3a5c;color:#e6e9f5}
.blk.sub b{color:#ffb15c}
.blk.br{background:#11463a;color:#c9f7e6;display:flex;gap:4px;align-items:center}
.blk.br img{height:100%;border-radius:4px}
.blk.mo{background:oklch(0.73 0.16 37 / .28);color:var(--txt)}
.lane.motion .blk{height:44px;bottom:auto;min-width:44px}
.blk.mu{background:#3a3220;color:#f3e1b5;cursor:default}
.blk.sel{border-color:var(--txt);box-shadow:0 0 0 2px var(--acc)}
.blk .rz{position:absolute;right:0;top:0;bottom:0;width:8px;cursor:ew-resize;background:rgba(255,255,255,.15)}
.ph{position:absolute;top:0;bottom:0;width:2px;background:#ff4d6d;pointer-events:none;z-index:5}
.busy{color:var(--warn);font-size:13px;margin-left:6px}
.spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:s 1s linear infinite;vertical-align:-2px}
@keyframes s{to{transform:rotate(360deg)}}
.steps{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:0 0 6px;font-size:13px}
.steps ol{margin:6px 0 0;padding-left:20px;color:var(--sub)}.steps li{margin:3px 0}
#adv{margin-top:14px;border-top:1px solid var(--line);padding-top:8px}#adv summary{cursor:pointer;font-weight:600;color:var(--sub);padding:4px 0}
.agent{border:1px dashed var(--acc);border-radius:10px;padding:10px;margin-top:8px}
.agent code{display:block;background:var(--bg);border-radius:8px;padding:8px;margin:6px 0;word-break:break-all;font-size:12.5px}
.ai-answer{width:100%;min-height:88px;background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;resize:vertical}
.ai-actions button,.ai-actions summary{min-height:44px}
.insert-panel input,.insert-panel select,.insert-panel button,.insert-panel summary{min-height:44px;max-width:100%}
.insert-panel input,.insert-panel select{min-width:0}
.insert-panel a{display:inline-flex;align-items:center;min-height:44px}
.insert-panel video,.insert-panel img{width:100%;max-height:220px;object-fit:contain}
.insert-panel .hint{overflow-wrap:anywhere}
.insert-panel .reason{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.motion-editor input:not([type=checkbox]),.motion-editor select,.motion-editor button,.motion-editor summary,.motion-editor .role{min-height:44px;max-width:100%}
.motion-editor input,.motion-editor select{min-width:0;flex:1}
.motion-editor .role{display:inline-flex;align-items:center;gap:8px}
.motion-editor .role input{flex:none}
.motion-editor{overflow-wrap:anywhere}
.phrase-editor input,.phrase-editor select,.phrase-editor button,.phrase-editor summary{min-height:44px;max-width:100%}
.phrase-editor input,.phrase-editor select{min-width:0}
.phrase-editor .source-copy,.phrase-editor .repair-message{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.repair-badge{color:var(--warn);border:1px solid var(--warn);border-radius:7px;padding:4px 8px}
.subject-box{position:absolute;pointer-events:none;z-index:5;border:2px dashed var(--warn);color:var(--warn);font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ov{position:absolute;pointer-events:none;z-index:4;background:rgba(5,7,12,.55)}.ov[hidden]{display:none}
.ov .safe{position:absolute;border:1.5px dashed rgba(255,196,0,.85);border-radius:4px}
.ov .col{position:absolute;right:0;bottom:0;background:rgba(239,68,68,.22);border-left:1.5px dashed rgba(239,68,68,.8)}
.ov .otxt{position:absolute;text-align:center;font-weight:700;line-height:1.2;transform:translateY(-50%);font-family:"Kanit","Leelawadee UI",sans-serif;paint-order:stroke fill}
.opt{display:block;margin:5px 0;cursor:pointer}.prob{color:var(--warn);font-size:12.5px;margin:2px 0}
@media (max-width:900px){
  main{height:auto;min-height:100vh;width:100%;grid-template-rows:auto auto auto;grid-template-columns:minmax(0,1fr)}
  .mid{grid-template-columns:minmax(0,1fr);min-width:0}
  .side{min-width:0;overflow:visible}
  .player{min-height:240px;height:300px}
  .tl{min-width:0}.tlbar{flex-wrap:wrap}.scroll{min-width:0}.tracks{grid-template-columns:84px minmax(0,1fr)}
}
  body.simple .media { display: none !important; }
</style>
<link rel="stylesheet" href="/shell.css?v=9">
<link rel="stylesheet" href="/ai-plan.css?v=1"><script src="/ai-plan.js?v=1"></script>
<script src="/ui.js?v=3"></script></head>
<body>
<main>
  <div class="top">
    <button onclick="location.href='/video-editor.html'" aria-label="กลับหน้าแรก">‹</button>
    <h1 id="title" translate="no">กำลังโหลด…</h1>
    <span id="repairStatus" class="repair-badge" role="status" hidden>ต้องแก้ซับ</span>
    <button class="pri" id="bAuto" title="ถอดเสียง ตัดเงียบ ซับ ภาพประกอบ เพลง เอฟเฟกต์ ให้ครบในครั้งเดียว">ทำให้ครบ</button>
    <button id="bCover">ปก</button>
    <button id="bExport">ส่งออก</button>
    <button id="bCapcut" title="เกลาต่อในแอป CapCut">แก้ต่อใน CapCut</button>
    <span class="busy" id="busy"></span>
  </div>
  <div class="mid">
    <div class="player" id="player"><div class="empty" id="empty" role="status" aria-live="polite">กำลังเตรียมตัวเล่น…</div>
      <hyperframes-player id="v" controls style="display:none;width:100%;height:100%"></hyperframes-player>
      <div class="subject-box" id="subjectBox" hidden>พื้นที่ที่ระบุ</div><div class="ov" id="ov" hidden><div class="safe" id="osafe"></div><div class="col" id="ocol"></div><div class="otxt" id="otxt"></div></div></div>
    <div class="side" id="side"></div>
  </div>
  <div class="tl">
    <div class="tlbar"><span class="t" id="tc">0:00.0 / 0:00</span>
      <span>ซูม</span><input type="range" id="zoom" aria-label="ซูมไทม์ไลน์" min="10" max="160" value="40" style="width:140px">
      <button id="bAddBr" class="media">+ ภาพประกอบตรงเส้นแดง</button>
      <span class="hint">คลิกชิ้นไหนเพื่อแก้ทางขวา · ลากภาพประกอบเพื่อเลื่อน ลากขอบขวาเพื่อยืด · Space เล่น/หยุด · Delete ลบ</span></div>
    <div class="tracks" id="tracks">
      <div><div style="height:18px"></div><div class="lab">ข้อความ</div><div class="lab media">ภาพประกอบ</div><div class="lab" id="motionLabel">ข้อความใหญ่</div><div class="lab media">เพลง</div></div>
      <div class="scroll" id="scroll"><div class="inner" id="inner" translate="no"></div></div>
    </div>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const PATH = new URLSearchParams(location.search).get('path');
let T = null, PL = null, SEL = null, PX = 40, MUSIC = null, zonePreview = null;
const mm = t => Math.floor(t / 60) + ':' + (t % 60).toFixed(1).padStart(4, '0');
async function api(path, body) {
  const r = await fetch('/api/video/' + path, body === undefined ? {} : {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(typeof j.detail === 'string' ? j.detail : (j.detail && j.detail.why) || r.statusText);
  return j;
}
function say(html) { $('busy').innerHTML = html; }

fetch('/api/video/config').then(r => r.json()).then(c => document.body.classList.toggle('simple', !!c.simple)).catch(() => {});

async function load(accept = () => true) {
  const timeline = await api('draft/timeline?path=' + encodeURIComponent(PATH));
  if (!accept()) return false;
  T = timeline;
  $('title').textContent = T.name;
  $('repairStatus').hidden = !(T.quality?.layout_errors?.length);
  document.title = T.name + ' · ตัดต่อ';
  PL = {broll: T.broll.map(b => ({...b})), music: {...T.music}, sfx: {...T.sfx}};
  drawTL(); side();
  live();
  return true;
}
let building = null, again = false;
const PLAYER_LOADING = $('empty').textContent;
async function live() {
  if (building) { again = true; return building; }
  const v = $('v'), at = v.currentTime || 0;
  building = api('draft/hf-build', {path: PATH}).then(r => {
    const src = r.url + '?t=' + Date.now(), empty = $('empty');
    v.style.visibility = 'hidden'; $('player').setAttribute('aria-busy', 'true');
    empty.textContent = PLAYER_LOADING; empty.style.display = '';
    v.addEventListener('ready', () => { if (v.getAttribute('src') === src) { try { v.seek(at); } catch {} } }, {once: true});
    v.addEventListener('painted', () => requestAnimationFrame(() => {
      if (v.getAttribute('src') !== src || !v.painted) return;
      v.style.visibility = 'visible'; empty.style.display = 'none'; $('player').setAttribute('aria-busy', 'false');
    }), {once: true});
    v.setAttribute('src', src); v.style.display = 'block';
  }).catch(e => { $('player').setAttribute('aria-busy', 'false'); $('empty').style.display = ''; $('empty').textContent = '❌ ' + ckErr(e); })
    .finally(() => { building = null; if (again) { again = false; return live(); } });
  return building;
}
// one save for b-roll / music / effects (the export follows this list exactly)
let savingPL = false;
async function savePL() {
  if (savingPL) return false;
  savingPL = true;
  const payload = () => JSON.stringify({path: PATH, ...PL, broll: PL.broll.filter(b => b.file)});
  try {
    while (true) {
      const sent = payload(), selected = SEL?.type === 'broll' ? PL.broll[SEL.i] : null;
      const r = await api('draft/placed', JSON.parse(sent));
      if (payload() !== sent) continue; // A newer manual edit must finish before adopting canonical rows.
      PL = r.placed;
      if (selected) { const i = PL.broll.findIndex(b => selected.placement_id ? b.placement_id === selected.placement_id : b.start === selected.start); SEL = i < 0 ? null : {type: 'broll', i, key: 'b' + i}; }
      say('บันทึกแล้ว'); drawTL(); side(); live(); return true;
    }
  } catch (e) { say('❌ ' + ckErr(e)); return false; }
  finally { savingPL = false; }
}

// ── timeline ──
function drawTL() {
  const inner = $('inner'), dur = T.duration || 1;
  inner.style.width = Math.max(dur * PX + 40, $('scroll').clientWidth) + 'px';
  inner.innerHTML = '';
  const ruler = document.createElement('div'); ruler.className = 'ruler';
  const step = PX >= 80 ? 1 : PX >= 30 ? 2 : 5;
  for (let s = 0; s <= dur; s += step) { const i = document.createElement('i'); i.style.left = s * PX + 'px'; i.textContent = mm(s).replace(/\.\d$/, ''); ruler.appendChild(i); }
  inner.appendChild(ruler);
  const lane = () => { const l = document.createElement('div'); l.className = 'lane'; l.style.marginTop = '4px'; inner.appendChild(l); return l; };
  const lSub = lane(), lBr = lane(), lMo = lane(), lMu = lane();
  lBr.classList.add('media'); lMu.classList.add('media');
  const blk = (laneEl, cls, a, b, html, sel) => {
    const d = document.createElement(cls === 'mo' ? 'button' : 'div');
    d.className = 'blk ' + cls + (SEL && SEL.key === sel.key ? ' sel' : '');
    d.style.left = a * PX + 'px'; d.style.width = Math.max(6, (b - a) * PX - 2) + 'px';
    d.innerHTML = html;
    d.onclick = e => {
      if (d._moved) return;
      const focused = document.activeElement === d;
      SEL = sel; seek(a); drawTL(); side(); e.stopPropagation();
      if (focused && cls === 'mo') inner.querySelector('.blk.mo.sel')?.focus({preventScroll:true});
    };
    laneEl.appendChild(d);
    return d;
  };
  T.phrases.forEach((p, i) => {
    const last = !T.phrases[i + 1] || T.phrases[i + 1].cue_id !== p.cue_id;
    const d = blk(lSub, 'sub', p.start, p.end, `${esc(p.lead)} <b>${esc(p.punch)}</b>${last ? '<div class="rz"></div>' : ''}`, {type: 'phrase', key: 'p' + i, i});
    dragLine(d, p);
  });
  PL.broll.forEach((b, i) => {
    const d = blk(lBr, 'br', b.start, b.start + b.dur, `${b.thumb ? `<img src="${b.thumb}">` : '🎞️'}<span>${esc(b.query || 'ไฟล์ของเรา')}</span><div class="rz"></div>`, {type: 'broll', key: 'b' + i, i});
    dragBlock(d, b);
  });
  lMo.classList.add('motion');
  const motionEnds = [];
  T.motions.map((m, i) => ({m, i})).sort((a, b) => a.m.start - b.m.start || a.i - b.i).forEach(({m, i}) => {
    const left = m.start * PX, width = Math.max(44, m.duration * PX - 2);
    let row = motionEnds.findIndex(end => end <= left);
    if (row < 0) row = motionEnds.length;
    motionEnds[row] = left + width + 2;
    const d = blk(lMo, 'mo', m.start, m.start + m.duration, '⚡ ' + esc(m.text || ''), {type: 'motion', key: 'm' + i, i});
    d.style.top = (3 + row * 48) + 'px';
    d.style.width = width + 'px';
  });
  lMo.style.height = $('motionLabel').style.height = (Math.max(1, motionEnds.length) * 48 + 2) + 'px';
  if (PL.music.file) blk(lMu, 'mu', 0, dur, '🎵 ' + esc(PL.music.file.split(/[\\/]/).pop()) + ` · ${Math.round(PL.music.volume * 100)}%`, {type: 'music', key: 'mu'});
  else blk(lMu, 'mu', 0, Math.min(dur, 6), '🎵 ไม่มีเพลง · คลิกเพื่อเลือก', {type: 'music', key: 'mu'});
  const ph = document.createElement('div'); ph.className = 'ph'; ph.id = 'ph'; inner.appendChild(ph);
  inner.onclick = e => { const r = inner.getBoundingClientRect(); seek((e.clientX - r.left) / PX); };
  tick();
}
const esc = s => String(s || '').replace(/[<&]/g, c => c === '<' ? '&lt;' : '&amp;');
function dragBlock(d, b) {
  d.addEventListener('pointerdown', e => {
    const resize = e.target.classList.contains('rz'), x0 = e.clientX, s0 = b.start, d0 = b.dur;
    d.setPointerCapture(e.pointerId); d._moved = false;
    const move = ev => {
      const dt = (ev.clientX - x0) / PX;
      if (Math.abs(ev.clientX - x0) > 3) d._moved = true;
      if (resize) b.dur = Math.max(0.1, +(d0 + dt).toFixed(2));
      else { b.start = Math.max(0, +(s0 + dt).toFixed(2)); b.anchor = {kind: 'timeline', start: b.start}; delete b.opportunity_id; }
      d.style.left = b.start * PX + 'px'; d.style.width = Math.max(6, b.dur * PX - 2) + 'px';
    };
    const up = () => { d.removeEventListener('pointermove', move); d.removeEventListener('pointerup', up);
      if (d._moved) { savePL(); side(); setTimeout(() => d._moved = false, 0); } };
    d.addEventListener('pointermove', move); d.addEventListener('pointerup', up);
  });
}
// a subtitle line moves as one piece (all its phrases); its last phrase's right edge sets where it ends
function dragLine(d, p) {
  d.addEventListener('pointerdown', e => {
    const sub = T.subs.find(s => s.id === p.cue_id);
    if (!sub) return;
    const resize = e.target.classList.contains('rz'), x0 = e.clientX;
    const mates = [...document.querySelectorAll('.blk.sub')].filter((_, k) => T.phrases[k].cue_id === p.cue_id);
    const lefts = mates.map(m => parseFloat(m.style.left)), w0 = parseFloat(d.style.width);
    d.setPointerCapture(e.pointerId); d._moved = false;
    let dt = 0;
    const move = ev => {
      dt = (ev.clientX - x0) / PX;
      if (Math.abs(ev.clientX - x0) > 3) d._moved = true;
      if (resize) d.style.width = Math.max(6, w0 + dt * PX) + 'px';
      else mates.forEach((m, k) => m.style.left = Math.max(0, lefts[k] + dt * PX) + 'px');
    };
    const up = async () => {
      d.removeEventListener('pointermove', move); d.removeEventListener('pointerup', up);
      if (!d._moved) return;
      const start = resize ? sub.start : Math.max(0, +(sub.start + dt).toFixed(2));
      const end = resize ? Math.max(sub.start + 0.3, +(sub.end + dt).toFixed(2)) : +(sub.end + (start - sub.start)).toFixed(2);
      try { await api('draft/line-time', {path: PATH, line: p.line, cue_id: p.cue_id, start, end}); await reload(); say(''); }
      catch (err) { say('❌ ' + ckErr(err)); drawTL(); }
      setTimeout(() => d._moved = false, 0);
    };
    d.addEventListener('pointermove', move); d.addEventListener('pointerup', up);
  });
}
function seek(t) { const v = $('v'); try { v.seek(Math.max(0, t)); } catch {} placePH(t); }
function placePH(t) { const p = $('ph'); if (p) p.style.left = t * PX + 'px'; $('tc').textContent = mm(t) + ' / ' + mm(T.duration).replace(/\.\d$/, ''); }
function tick() { placePH($('v').currentTime || 0); if (zonePreview) zonePreview(); }
(function loop() { if (T) tick(); requestAnimationFrame(loop); })();
$('zoom').oninput = e => { PX = +e.target.value; drawTL(); };

// ── right panel: the selected piece, or the whole clip's settings ──

let aiReview;

    const a = document.createElement('a');

  } catch (e) { $('aiMessage').textContent = ckErr(e); }

}
async function importAi() {
  const button = $('aiImport'), answer = $('aiAnswer').value;
  if (!answer.trim()) { $('aiMessage').textContent = 'วางคำตอบ JSON ก่อน'; return; }
  $('aiMessage').textContent = '';
  button.disabled = true;
  try {
    if (!await aiReview.check(answer)) return;
    button.textContent = 'กำลังใช้…'; $('aiAnswer').disabled = true;
    await api('web-ai/import', {step: 'clip', target: PATH, answer});

  } catch (e) { aiReview.clear(); $('aiMessage').textContent = ckErr(e); }
  finally { button.disabled = false; $('aiAnswer').disabled = false; }
}
function insertAiPanel() {

    } catch (e) { message(ckErr(e)); }

      const a = document.createElement('a');

    catch (e) { message(ckErr(e)); }
  };

function showInsertPlan(box, rows) {
  box.replaceChildren();
  if (!rows.length) return;
  const select = document.createElement('select'), preview = document.createElement('div');
  select.setAttribute('aria-label', 'ช่วงภาพแทรก');
  rows.forEach((row, i) => { const option = document.createElement('option'); option.value = i; option.textContent = `${mm(row.start)} · ${row.dur} วิ · ${row.file.split(/[\\/]/).pop().slice(0, 24)}`; select.appendChild(option); });
  const show = () => {
    const row = rows[+select.value], media = document.createElement(row.kind === 'image' ? 'img' : 'video');
    media.src = '/api/kit/media?path=' + encodeURIComponent(row.file);
    if (row.kind !== 'image') { media.controls = true; media.muted = true; media.onloadedmetadata = () => { media.currentTime = row.source_start || 0; }; }
    const text = document.createElement('div'); text.className = 'hint reason'; text.textContent = row.reason; text.title = row.reason;
    const source = document.createElement('div'); source.className = 'hint'; source.textContent = `${row.source_ref?.provider || 'ไฟล์ของเรา'} · สิทธิ์: ${row.source_ref?.license_status || 'unverified'} · ช่วงต้นฉบับ ${row.source_start || 0} วิ`;
    preview.replaceChildren(media, text, source);
  };
  select.onchange = show; box.append(select, preview); show();
}
function sideSubjectZones(s) {

    <button class="pri" id="zSave">บันทึกพื้นที่</button></div>`;

  const fill=()=>{
    const row=zones[+select.value];fields.forEach((input,i)=>{input.disabled=!row;input.value=row?(i<2?row[keys[i]]:row[keys[i]]*100):'';});

  });

  $('zRemove').onclick=async()=>{const index=+select.value,row=zones[index];if(row && await ckConfirm(`ลบพื้นที่ ${mm(row.start)}–${mm(row.end)}?`)){zones.splice(index,1);list(index);dirty();}};

  box.textContent = error ? 'ต้องสร้างใหม่ · ' + error.error : 'ยังไม่ได้ตรวจแผน';
  $('mdel').onclick = async () => { if (await ckConfirm('ลบ motion นี้?\n' + (m.text || m.template || ''))) { try { await removeMotion(m); } catch (e) { say('❌ ' + ckErr(e)); } } };
  if (!editable) return;
  const roles = {normal:'ปกติ',emphasis:'คำเน้น',caption:'ซับแปล',second:'บรรทัดสอง'};
  if (pair) {

    $('mCue').value = m.cue_id || m.ownership?.targets?.[0]?.cue_id || '';
    const showRoles = () => {

      $('mRoles').innerHTML=Object.entries(roles).filter(([role])=>cue?.roles?.[role]).map(([role,label])=>`<label class="role"><input type="checkbox" data-role="${role}" ${selected?.includes(role)?'checked':''}>${label}</label>`).join('');

    if (pair) {
      const cue=(T.motion_cues || []).find(c=>c.cue_id===$('mCue').value), selected=[...$('mRoles').querySelectorAll('input:checked')].map(input=>input.dataset.role);
      if (!cue || !selected.length) throw Error('เลือกข้อความและบทบาทก่อนตรวจ');
      request.start=Math.min(...selected.map(role=>cue.roles[role].start)); request.end=Math.max(...selected.map(role=>cue.roles[role].end));
      Object.assign(request,{cue_id:cue.cue_id,text:cue.text,anchor:{kind:'timeline',start:request.start},ownership:{mode:'replace',targets:[{cue_id:cue.cue_id,roles:selected}],caption_policy:selected.includes('caption')?'replace':'preserve'}});
    } else {
      request.start=+$('mStart').value; request.end=+$('mEnd').value;
      Object.assign(request,{ownership:m.ownership,anchor:$('mAnchor').value==='time'?{kind:'timeline',start:request.start}:m.anchor,
        params:{...params,duration:request.end-request.start},placement:Object.fromEntries(['x','y','w','h'].map(key=>[key,+$('m'+key).value/100]))});
      for (const key of m.template==='hook-title'?['key','sub']:['number','unit','label']) request.params[key]=$('m'+key).value;
      if ($('mFont').value==='default') delete request.params.font;
    }
    return request;
  }, request=>api('draft/overlay-preview',request), async request=>{
    const result=await api('draft/overlay',request); setMotions(result.overlays);
    T.motion_recipe_errors=(T.motion_recipe_errors || []).filter(e=>e.placement_id!==m.placement_id); drawTL(); live(); say('บันทึก motion แล้ว');
  },ckErr);
  editor.oninput=review.clear;
}
function sideMusic(s) {
  const q = encodeURIComponent((T.style && T.style.music_mood) || 'corporate background');
  s.innerHTML = `${back()}<h3>🎶 เพลง</h3>
    <div class="row"><select id="ms" style="flex:1"><option>กำลังอ่านคลังเพลง…</option></select></div>

    <div class="hint">โหลดเพลงจาก Pixabay แล้ว กด "ใช้ไฟล์ของเรา" เลือกไฟล์นั้น · เพลงเบาคงที่ตลอดคลิป</div>`;
  const listen = f => { $('ma').src = f ? '/api/kit/media?path=' + encodeURIComponent(f) : ''; };
  (MUSIC || (MUSIC = api('music').then(d => d.music || []).catch(() => []))).then(list => {
    const opts = [['', '— ไม่มีเพลง —'], ...list.map(x => [x.path, x.name.replace(/\.[^.]+$/, '') + (x.moods.length ? ' · ' + x.moods.join(' ') : '')])];
    if (PL.music.file && !list.some(x => x.path === PL.music.file)) opts.push([PL.music.file, PL.music.file.split(/[\\/]/).pop()]);
    $('ms').innerHTML = opts.map(([v, t]) => `<option value="${v.replace(/"/g, '&quot;')}">${esc(t)}</option>`).join('');
    $('ms').value = PL.music.file || ''; listen(PL.music.file);

  $('ms').onchange = e => { PL.music.file = e.target.value; listen(e.target.value); savePL(); drawTL(); };
  $('mown').onclick = async () => { const r = await fetch('/api/kit/browse-file', {method: 'POST'}).then(x => x.json()).catch(() => ({})); if (!r.path) return;
    PL.music.file = r.path; savePL(); drawTL(); side(); };
  $('mweb').onclick = () => window.open('https://pixabay.com/music/search/' + q + '/', '_blank');
  $('mv').oninput = e => { $('mvt').textContent = Math.round(e.target.value * 100) + '%'; };
  $('mv').onchange = e => { PL.music.volume = +e.target.value; savePL(); drawTL(); };

function setMotions(items) {
  const motionSelected = SEL?.type === 'motion', selected = motionSelected ? T.motions[SEL.i] : null;
  T.motions = items;
  if (motionSelected) {
    const matches = items.map((m,i) => ({m,i})).filter(({m}) => selected && (selected.placement_id ? m.placement_id === selected.placement_id : m.file === selected.file && m.start === selected.start && m.duration === selected.duration));
    SEL = matches.length === 1 ? {type:'motion',i:matches[0].i,key:'m'+matches[0].i} : null;
  }
}
async function removeMotion(m) {
  const result = await api('draft/overlay-remove', {path:PATH,placement_id:m.placement_id,start:m.start});
  setMotions(result.overlays);
  T.motion_recipe_errors = (T.motion_recipe_errors || []).filter(e => e.placement_id !== m.placement_id);
  drawTL(); if (!SEL) side(); live();
}
async function del() {
  if (!SEL) return;
  if (SEL.type === 'broll') { PL.broll.splice(SEL.i, 1); savePL(); }
  else if (SEL.type === 'motion') return removeMotion(T.motions[SEL.i]);
  else return;
  SEL = null; drawTL(); side();
}
async function reload() { const keep = SEL; await load(); SEL = keep && (keep.type !== 'broll' || PL.broll[keep.i]) ? keep : null; drawTL(); side(); }

};
async function run(btn, text, fn) {

$('bAuto').onclick = () => run($('bAuto'), 'กำลังทำทุกขั้น… (1–3 นาที)', async () => {
  const r = await api('draft/auto', {path: PATH}); await load(); say('✅ ' + r.steps.filter(Boolean).join(' · ') + ' · แก้บนไทม์ไลน์ได้เลย เห็นผลทันที');

// ── text settings, checked before every export (MP4 or CapCut project) ──
const TIDY = [['lines', 'ตัดเป็น 2 บรรทัดตามความหมาย', 'แนะนำ · ยาวเกิน 2 บรรทัดจะแยกเป็นซับใหม่ตามจังหวะพูด'],
  ['split', 'แยกเป็นซับใหม่', 'บรรทัดเดียวเสมอ อ่านเร็ว'], ['shrink', 'ย่อตัวอักษร', 'ย่อได้ถึง 3/4 ถ้ายังยาวจะตัดบรรทัดแทน']];
const WHERE = {'top bar': 'แถบบนของแอป', 'caption area at the bottom': 'แคปชันด้านล่าง', 'button column / frame edge': 'ปุ่มด้านขวา / ขอบจอ'};
const probs = c => c.problems.length ? c.problems.map(p => `<div class="prob">⚠️ ${esc(p.replace(/[a-z][a-z /]+[a-z]/g, w => WHERE[w] || w))}</div>`).join('') + '<div class="hint">ใน MP4 ระบบขยับบรรทัดเหล่านี้เข้ากรอบให้เอง แต่ในโปรเจกต์ CapCut จะอยู่ตรงนี้ · เลื่อนตำแหน่งขึ้นหรือลดขนาดได้เลย จอซ้ายเปลี่ยนตาม</div>' : '<div class="hint">✅ ทุกบรรทัดอยู่ในเขตปลอดภัย ไม่โดนปุ่มหรือแคปชันของแอป</div>';
let TC = null;  // text-check: the subtitle look, the safe box, lines outside it
const tVal = () => ({size: +$('tSize').value, y: +$('tY').value, line_h: +$('tLh').value, color: $('tColor').value.toLowerCase(), stroke: +$('tStroke').value});
function fitLines(text, px, maxW) {  // render._fit in the browser: one line, else two balanced at a Thai word break, then smaller
  const c = fitLines.c || (fitLines.c = document.createElement('canvas').getContext('2d'));
  c.font = `700 ${px}px Kanit, "Leelawadee UI", sans-serif`;
  const wd = t => c.measureText(t).width;
  let lines = text.includes('\n') ? text.split('\n') : [text];
  if (lines.length === 1 && wd(text) > maxW) {
    const segs = [...new Intl.Segmenter('th', {granularity: 'word'}).segment(text)].map(x => x.segment);
    let best = null;
    for (let i = 1; i < segs.length; i++) {
      const a = segs.slice(0, i).join('').trim(), b = segs.slice(i).join('').trim(), m = Math.max(wd(a), wd(b));
      if (a && b && (!best || m < best[0])) best = [m, a, b];
    }
    if (best) lines = [best[1], best[2]];
  }
  const widest = Math.max(...lines.map(wd));
  return {lines, px: widest > maxW ? px * maxW / widest : px};
}
function overlay(v) {  // what the subtitle will look like, drawn at once over the player while the preview rebuilds
  if (!TC || !TC.look) return;
  const p = $('player').getBoundingClientRect(), W = T.width, H = T.height, k = Math.min(p.width / W, p.height / H);
  const w = W * k, h = H * k, b = TC.box, sw = b.w, st = b.top, sb = b.bottom, px = v.size * TC.px_per_size * Math.min(W, H) / 1080 * k;
  Object.assign($('ov').style, {left: (p.width - w) / 2 + 'px', top: (p.height - h) / 2 + 'px', width: w + 'px', height: h + 'px'});
  Object.assign($('osafe').style, {left: (1 - sw) / 2 * w + 'px', width: sw * w + 'px', top: st * h + 'px', height: (sb - st) * h + 'px'});
  $('ocol').style.display = b.col ? '' : 'none';  // the app's like / comment / share buttons
  if (b.col) Object.assign($('ocol').style, {width: b.col[0] * w + 'px', top: b.col[1] * h + 'px'});
  const at = ($('v').currentTime || 0), cur = (TC.subs || []).find(s => s.start <= at && at < s.end) || TC.look;
  const f = fitLines(cur.text, px, sw * w), half = f.lines.length * f.px * v.line_h / 2;
  const mid = Math.min(Math.max((1 - v.y) / 2 * h, st * h + half), sb * h - half);  // the MP4 keeps lines inside the box, as render._safe_y
  Object.assign($('otxt').style, {left: (1 - sw) / 2 * w + 'px', width: sw * w + 'px', top: mid + 'px', fontSize: f.px + 'px', lineHeight: v.line_h,
    whiteSpace: 'nowrap', color: v.color, webkitTextStroke: (f.px * v.stroke * 2.4 + 1) + 'px #000'});
  $('otxt').innerHTML = f.lines.map(esc).join('<br>');
  $('ov').hidden = false;
}
async function textPanel(st) {
  TC = await api('draft/text-check?path=' + encodeURIComponent(PATH));
  if (!$('tSize')) return;
  if (!TC.look) { $('tProb').innerHTML = '<div class="hint">ยังไม่มีซับ · กด "ทำให้ครบ" ก่อน</div>'; return; }
  const l = TC.look, was = {size: l.size || 14, y: l.y ?? -0.44, line_h: TC.line_h, color: (l.color || '#ffffff').toLowerCase(), stroke: l.stroke ?? 0.08};
  $('tSize').value = was.size; $('tY').value = was.y; $('tLh').value = was.line_h; $('tColor').value = was.color; $('tStroke').value = was.stroke;
  $('tZone').innerHTML = Object.entries(TC.zones).map(([k, t]) => `<option value="${k}"${k === TC.zone ? ' selected' : ''}>${esc(t)}</option>`).join('');
  $('tZone').onchange = async () => {
    await api('draft/look', {path: PATH, style: {safe_zone: $('tZone').value}}); T.style.safe_zone = $('tZone').value;
    TC = await api('draft/text-check?path=' + encodeURIComponent(PATH)); showProb(TC); overlay(tVal()); await live(); if (!timer) $('ov').hidden = true;
  };
  const label = () => { $('tSizeV').textContent = $('tSize').value; $('tLhV').textContent = (+$('tLh').value).toFixed(2) + ' เท่า'; $('tYV').textContent = Math.round((1 - $('tY').value) / 2 * 100) + '% จากบน';
    $('tModeH').textContent = TIDY.find(t => t[0] === $('tMode').value)[2]; };
  const showProb = c => { $('tProb').innerHTML = probs(c); };
  label(); showProb(TC);
  let timer = null;
  ['tSize', 'tY', 'tLh', 'tColor', 'tStroke'].forEach(id => {
    $(id).oninput = () => { label(); overlay(tVal()); clearTimeout(timer); timer = setTimeout(save, 500); };
  });
  async function save() {
    const now = tVal(), style = Object.fromEntries(Object.entries(now).filter(([k, v]) => v !== was[k]));  // only what changed: emphasised lines keep their colour
    timer = null;
    if (!Object.keys(style).length) return;
    try {
      await api('draft/style', {path: PATH, ...style}); Object.assign(was, style);
      TC = await api('draft/text-check?path=' + encodeURIComponent(PATH)); showProb(TC);
      await live();
      if (!timer) $('ov').hidden = true;  // the rebuilt preview now shows the real thing
    } catch (e) { $('tProb').innerHTML = '<div class="prob">❌ ' + esc(ckErr(e)) + '</div>'; }
  }
  $('tMode').onchange = async () => { label(); await api('draft/look', {path: PATH, style: {tidy: $('tMode').value}}); T.style.tidy = $('tMode').value; };
  $('tTidy').onclick = async () => {
    try {
      const r = await api('draft/tidy', {path: PATH, mode: $('tMode').value});
      say(`จัดซับแล้ว: 2 บรรทัด ${r.two_lines} · แยกใหม่ ${r.split} · ย่อ ${r.shrunk} · ย้ายคำเชื่อม ${r.moved_words}`);
      await reload(); live();
    } catch (e) { say('❌ ' + ckErr(e)); }
  };
}
// Export checks are read-only; subtitle tidying remains an explicit editor action.
async function checkText(label) {
  const c = await api('draft/text-check?path=' + encodeURIComponent(PATH));
  if (!c.look) return true;
  if (!c.problems.length || await ckConfirm(`ยังมี ${c.problems.length} บรรทัดโดนปุ่มหรือแคปชันของแอป\n\n${c.problems.slice(0, 5).map(p => p.replace(/[a-z][a-z /]+[a-z]/g, w => WHERE[w] || w)).join('\n')}\n\nกด OK เพื่อ${label}ต่อ · Cancel เพื่อไปแก้ที่ ตั้งค่าทั้งคลิป > ข้อความ`)) return true;
  SEL = null; drawTL(); side(); $('adv').open = true; setTimeout(() => $('txtH') && $('txtH').scrollIntoView({behavior: 'smooth'}), 300);
  return false;
}

document.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input,select,textarea')) return;
  if (e.key === ' ' && e.target.closest?.('button')) return;
  if (e.key === ' ') { e.preventDefault(); const v = $('v'); v.paused ? v.play() : v.pause(); }

  if (SEL && SEL.type === 'broll' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
    const b = PL.broll[SEL.i]; b.start = Math.max(0, +(b.start + (e.key === 'ArrowLeft' ? -0.1 : 0.1)).toFixed(2)); b.anchor = {kind: 'timeline', start: b.start}; delete b.opportunity_id; drawTL(); clearTimeout(window._sv); window._sv = setTimeout(savePL, 400);
  }
});

function broken(msg) {
  $('title').textContent = PATH ? 'เปิดโปรเจกต์นี้ในหน้านี้ไม่ได้' : msg;
