<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ทำปก</title>
<style>
:root{--bg:#0e0f12;--card:#16171b;--card2:#1d1f24;--line:#2a2c33;--txt:#ececf1;--sub:#c9cbd3;--mut:#8b8d98;--acc:#6c4cf0;--acc2:#38bdf8;--ok:#10b981;--bad:#ef4444}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.6 "Segoe UI","Leelawadee UI",system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:24px 16px 60px;display:grid;grid-template-columns:1fr 340px;gap:20px}
@media (max-width:760px){main{grid-template-columns:1fr}}
.top{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}
h1{font-size:18px;font-weight:600;margin:0}
a{color:var(--acc2);text-decoration:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
label{display:block;color:var(--sub);font-size:14px;margin:12px 0 4px}
input,select{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 10px;font:inherit}
.row{display:flex;gap:8px}
button{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:7px 14px;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer}
button.ghost{background:var(--card2);color:var(--sub);border:1px solid var(--line);flex:none}
button:disabled{opacity:.5;cursor:wait}
.big{width:100%;margin-top:16px;padding:14px;font-size:16px}
.msg{margin-top:10px;font-size:14px;word-break:break-all}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.preview{position:sticky;top:16px;aspect-ratio:9/16;background:var(--card2);border-radius:14px;border:1px solid var(--line);overflow:hidden}
.preview iframe{position:absolute;left:0;top:0;width:1080px;height:1920px;border:0;transform-origin:0 0;pointer-events:none}
.preview .tag{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:3px 8px;border-radius:99px}
.colors{display:grid;grid-template-columns:auto auto auto;gap:8px 12px;align-items:center;font-size:14px;color:var(--sub)}
.sw{display:flex;align-items:center;gap:6px;margin:0}
.sw input{width:44px;height:32px;padding:2px;border-radius:8px}
</style>
<link rel="stylesheet" href="/shell.css?v=9">
<script src="/ui.js?v=3"></script></head>
<body>
<main>
  <div class="top"><h1>🖼️ ทำปก</h1></div>
  <div class="card">
    <label>ภาพพื้นหลัง (เลือกคลิปวิดีโอ หรือรูป)</label>
    <div class="row"><input id="src" placeholder="D:\...\clip.mov"><button class="ghost" id="pick">เลือกไฟล์</button></div>
    <label>ถ้าเป็นวิดีโอ: เลือกภาพ</label>
    <button class="ghost" id="suggest" style="width:100%">🔎 หาภาพสวย 6 ภาพให้เลือก</button>
    <div id="frames" style="display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:8px"></div>
    <label for="at">หรือใส่วินาทีเอง</label>
    <input id="at" type="number" min="0" step="0.5" value="1">
    <label for="l1">หัวข้อบรรทัด 1 (ใหญ่)</label>
    <input id="l1" placeholder="เช่น ธุรกิจสมัยนี้">
    <label for="l2">หัวข้อบรรทัด 2 (รอง)</label>
    <input id="l2" placeholder="เช่น ไม่ต้องแย่งทำเลอีกแล้ว">
    <label for="font">ฟอนต์</label>
    <select id="font"></select>
    <label for="layout">แบบปก</label>
    <select id="layout"><option value="cover-a">A · ตัวหนา 2 สี</option></select>
    <label>สี (เลือกเองได้ หรือกดชุดสำเร็จรูป)</label>
    <div class="row" style="flex-wrap:wrap;gap:6px;margin-bottom:8px">
      <button class="ghost" data-preset="#ff7d00,#ffffff,#ffffff,#111111">ส้ม</button>
      <button class="ghost" data-preset="#051192,#ffffff,#ffffff,#111111">น้ำเงิน · ผู้ให้ข้อมูล 1</button>
      <button class="ghost" data-preset="#ec1d1d,#ffffff,#ffffff,#111111">แดง</button>
      <button class="ghost" data-preset="#ffd400,#111111,#ffffff,#111111">เหลือง</button>
    </div>
    <div class="colors">
      <span>บรรทัด 1</span><label class="sw">ตัว <input type="color" id="c1" value="#ff7d00"></label><label class="sw">ขอบ <input type="color" id="s1" value="#ffffff"></label>
      <span>บรรทัด 2</span><label class="sw">ตัว <input type="color" id="c2" value="#ffffff"></label><label class="sw">ขอบ <input type="color" id="s2" value="#111111"></label>
    </div>
    <button class="big" id="go">ทำปก</button>
    <div class="msg" id="msg"></div>
  </div>
  <div class="preview" id="pv"><iframe id="live" title="ตัวอย่างปก"></iframe><span class="tag" id="pvTag">ตัวอย่างสด</span></div>
</main>
<script>
const $ = id => document.getElementById(id);
async function post(path, body) {
  const r = await fetch('/api/kit/' + path, {method:'POST', headers:{'Content-Type':'application/json'}, body: body ? JSON.stringify(body) : undefined});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.detail || r.statusText);
  return j;
}
$('pick').onclick = async () => { const r = await post('browse-file?start=' + encodeURIComponent($('src').value)); if (r.path) { $('src').value = r.path; refresh(); } };
$('suggest').onclick = async () => {
  const b = $('suggest'), box = $('frames'); b.disabled = true; b.textContent = 'กำลังหาภาพ… (ประมาณ 10 วินาที)'; box.innerHTML = '';
  try {
    const r = await post('cover-frames', {source: $('src').value.trim(), count: 6});
    r.frames.forEach(f => {
      const im = document.createElement('img');
      im.src = f.thumb; im.title = f.at + ' วินาที';
      im.style.cssText = 'width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:8px;cursor:pointer;border:3px solid transparent';
      im.onclick = () => { $('at').value = f.at; refresh(); box.querySelectorAll('img').forEach(x => x.style.borderColor = 'transparent'); im.style.borderColor = 'var(--acc)'; };
      box.appendChild(im);
    });
    if (r.frames[0]) box.querySelector('img').click();
  } catch (e) { box.innerHTML = '<div class="msg bad">❌ ' + ckErr(e) + '</div>'; }
  b.disabled = false; b.textContent = '🔎 หาภาพสวย 6 ภาพให้เลือก';
};
// installed fonts for the font pickers; the last choice is remembered on this machine
let FONTS = [];
const fontsReady = fetch('/api/kit/fonts').then(r => r.json()).then(j => FONTS = j.fonts || []).catch(() => FONTS = []);
const fontOptions = sel => '<option value="">ตามเทมเพลต</option>' + FONTS.map(f =>
  `<option${f === sel ? ' selected' : ''}>${f.replace(/</g, '&lt;')}</option>`).join('');
const savedFont = () => { try { return localStorage.getItem('ck_font') || ''; } catch { return ''; } };
const keepFont = v => { try { localStorage.setItem('ck_font', v); } catch {} };
fontsReady.then(() => { $('font').innerHTML = fontOptions(savedFont()); refresh(); });
$('font').addEventListener('input', () => keepFont($('font').value));
// ---- live preview: the real template in an iframe, scaled to the preview box ----
const COLORS = ['c1', 's1', 'c2', 's2'];
let bgUrl = '', bgKey = '', timer = 0;
function fitFrame() { const box = $('pv'); $('live').style.transform = `scale(${box.clientWidth / 1080})`; }
window.addEventListener('resize', fitFrame);
function refresh() {
  clearTimeout(timer);
  timer = setTimeout(() => {
    const src = $('src').value.trim(), at = parseFloat($('at').value) || 0, key = src + '@' + at;
    if (src && key !== bgKey) { bgKey = key; bgUrl = '/api/kit/frame?source=' + encodeURIComponent(src) + '&at=' + at; }
    const p = new URLSearchParams({l1: $('l1').value || 'หัวข้อบรรทัด 1', l2: $('l2').value || 'หัวข้อบรรทัด 2', bg: bgUrl});
    COLORS.forEach(k => p.set(k, $(k).value));
    if ($('font').value) p.set('font', $('font').value);
    $('live').src = '/motion/' + $('layout').value + '/index.html?' + p;
    $('pvTag').textContent = 'ตัวอย่างสด';
    fitFrame();
  }, 250);   // wait for typing to pause so the frame is not reloaded on every key
}
['src', 'at', 'l1', 'l2', 'layout', 'font', ...COLORS].forEach(id => $(id).addEventListener('input', refresh));
document.querySelectorAll('[data-preset]').forEach(b => b.onclick = () => {
  b.dataset.preset.split(',').forEach((v, i) => $(COLORS[i]).value = v);
  refresh();
});

$('go').onclick = async () => {
  const b = $('go'); b.disabled = true; $('msg').className = 'msg'; $('msg').textContent = 'กำลังทำปก… (ประมาณ 10–20 วินาที)';
  try {
    const body = {source: $('src').value.trim(), at: parseFloat($('at').value) || 0,
                  l1: $('l1').value.trim(), l2: $('l2').value.trim(), layout: $('layout').value};
    COLORS.forEach(k => body[k] = $(k).value);
    body.font = $('font').value;
    const r = await post('cover', body);
    $('pvTag').textContent = '✅ ไฟล์จริงที่บันทึกแล้ว';
    $('msg').className = 'msg ok'; $('msg').textContent = '✅ บันทึกแล้ว: ' + r.file;
  } catch (e) { $('msg').className = 'msg bad'; $('msg').textContent = '❌ ' + ckErr(e); }
  b.disabled = false;
};
const q = new URLSearchParams(location.search);   // filled from the clip flow: cover.html?src=&l1=&l2=
for (const k of ['src', 'l1', 'l2']) if (q.get(k)) $(k).value = q.get(k);
refresh();
</script>
<script src="/shell.js?v=13"></script>
</body>
</html>
