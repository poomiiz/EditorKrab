<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>คลังสไตล์</title>
<style>
:root{--bg:#0e0f12;--card:#16171b;--card2:#1d1f24;--line:#2a2c33;--txt:#ececf1;--sub:#c9cbd3;--mut:#8b8d98;--acc:#6c4cf0;--ok:#10b981;--warn:#f59e0b;--bad:#ef4444}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 "Segoe UI","Leelawadee UI",system-ui,sans-serif}
main{max-width:1200px;margin:0 auto;padding:22px 18px 60px}
h1{font-size:18px;font-weight:600;margin:0 0 4px}h2{font-size:17px;margin:26px 0 8px}.sub{color:var(--mut);font-size:14px;margin:0 0 16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
select,input[type=text]{background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit;min-width:220px}
button{background:var(--card2);color:var(--sub);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font:inherit;font-size:13.5px;cursor:pointer}
button:hover{border-color:var(--acc);color:#fff}button.go{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
button:disabled{opacity:.5;cursor:wait}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.item img.pv{width:100%;aspect-ratio:9/16;object-fit:cover;background:#000;display:block}
.item .ph{aspect-ratio:9/16;display:grid;grid-template-columns:1fr 1fr;gap:2px;background:#000}
.item .ph img{width:100%;height:100%;object-fit:cover}
.item .b{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
.item .t{font-weight:700;font-size:14px;word-break:break-all}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--card2);color:var(--sub);align-self:flex-start}
.tag.ok{background:rgba(16,185,129,.15);color:var(--ok)}.tag.warn{background:rgba(245,158,11,.15);color:var(--warn)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.row input{min-width:0;flex:1}
code{display:block;padding:8px 10px;background:#080a10;border-radius:8px;font-size:12.5px;word-break:break-all}
.msg{font-size:13px;color:var(--mut)}.msg.bad{color:var(--bad)}.msg.ok{color:var(--ok)}
.empty{color:var(--mut);font-size:14px}
h3{font-size:14px;color:var(--sub);margin:16px 0 8px}
.parts{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--sub)}.parts label{display:flex;gap:4px;align-items:center}
.family{grid-column:1/-1;border:1px solid var(--line);border-radius:14px;padding:2px 12px 12px}.family h3{margin:10px 0}
</style>
<link rel="stylesheet" href="/shell.css?v=8">
<script src="/ui.js?v=3"></script></head>
<body>
<main>
  <h1>🎨 คลังสไตล์</h1>
  <p class="sub">ถอดหน้าตาซับ (ขนาด สี ขอบ ตำแหน่ง) จากโปรเจกต์ CapCut หรือวิดีโอ ดูพรีวิวเป็นภาพนิ่งและภาพเคลื่อนไหว แล้วกดเก็บเข้าคอลเลกชันของคุณ · สไตล์ที่เก็บจะเลือกใช้ได้ทันทีตอนตัดคลิป (ชื่อขึ้นต้นด้วย my-)</p>

  <div class="box">
    <b>🔍 ถอดจาก</b>
    <select id="proj" aria-label="ถอดจากโปรเจกต์"><option value="">โปรเจกต์ CapCut ล่าสุด…</option></select>
    <button id="pick">เลือกไฟล์วิดีโอ / โฟลเดอร์โปรเจกต์</button>
    <button class="go" id="go" disabled>ถอดสไตล์</button>
    <span class="msg" id="startMsg"></span>
  </div>

  <h2>⏳ รอดูพรีวิว</h2>
  <div class="grid" id="lab"></div>

  <h2>⭐ คอลเลกชันของฉัน</h2>
  <div class="box" id="mixBox">
    <b>🧩 ประกอบสไตล์ใหม่</b>
    <select id="mMain" aria-label="สไตล์หลัก"></select><select id="mCaption" aria-label="สไตล์คำบรรยาย"></select><select id="mSecond" aria-label="สไตล์รอง"></select>
    <input type="text" id="mName" placeholder="ชื่อ preset ใหม่">
    <button class="go" id="mGo">สร้าง preset</button>
    <span class="msg" id="mMsg"></span>
  </div>
  <div id="mine"></div>
</main>
<script>
const $ = id => document.getElementById(id);
const pic = p => '/api/style/file?path=' + encodeURIComponent(p) + '&t=' + Date.now();
let SRC = '';
const CATS = {main: 'ซับปกติ + คำเน้น', caption: 'ซับสำหรับอ่าน', second: 'ประโยคเอียง'};
const ROLES = {main: ['normal', 'emphasis'], caption: ['caption'], second: ['second']};
async function api(url, body) {
  const r = await fetch(url, body ? {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)} : {});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.detail || r.status);
  return j;
}
function setSrc(p) { SRC = p; $('go').disabled = !p; $('startMsg').textContent = p ? p : ''; $('startMsg').className = 'msg'; }
function copy(text, btn) { navigator.clipboard.writeText(text).then(() => { const t = btn.textContent; btn.textContent = '✓ คัดลอกแล้ว'; setTimeout(() => btn.textContent = t, 1500); }); }
function card(x) {
  const el = document.createElement('div');
  el.className = 'item';
  const st = {ready: ['พร้อมดู', 'ok'], waiting_agent: ['รอ Claude ถอดจากเฟรม', 'warn'], needs_preview: ['มีสไตล์แล้ว รอทำพรีวิว', 'warn']}[x.status];
  el.innerHTML = (x.gif ? '<img class="pv">' : `<div class="ph">${x.frames.slice(0, 4).map(() => '<img>').join('')}</div>`) +
    `<div class="b"><div class="t"></div><span class="tag ${st[1]}">${x.kind === 'capcut' ? 'CapCut' : 'วิดีโอ'} · ${st[0]}</span><div class="act"></div><span class="msg"></span></div>`;
  el.querySelector('.t').textContent = x.name;
  el.querySelector('.t').title = x.source;
  const msg = el.querySelector('.msg'), act = el.querySelector('.act');
  const fail = e => { msg.textContent = '❌ ' + ckErr(e); msg.className = 'msg bad'; };
  if (x.gif) {
    const img = el.querySelector('img.pv'); let still = false;
    img.src = pic(x.gif); img.title = 'คลิกสลับ ภาพนิ่ง / ภาพเคลื่อนไหว';
    img.onclick = () => { still = !still; img.src = pic(still ? x.png : x.gif); };
    const has = Object.keys(CATS).filter(c => ROLES[c].every(r => x.style && x.style[r]));
    act.innerHTML = '<div class="parts"></div><div class="row" style="margin-top:6px"><input type="text" placeholder="ตั้งชื่อสไตล์"><button class="go">เก็บเข้าคอลเลกชัน</button></div>';
    act.querySelector('.parts').innerHTML = has.map(c => `<label><input type="checkbox" value="${c}" checked>${CATS[c]}</label>`).join('');
    act.querySelector('input[type=text]').value = x.name;
    act.querySelector('button').onclick = async () => {
      const name = act.querySelector('input[type=text]').value.trim();
      const parts = [...act.querySelectorAll('.parts input:checked')].map(i => i.value);
      if (!name) return fail(new Error('ตั้งชื่อก่อน'));
      if (!parts.length) return fail(new Error('ติ๊กอย่างน้อยหนึ่งหมวด'));
      try {
        const j = await api('/api/style/save', {folder: x.folder, name, parts});
        $('startMsg').textContent = '✓ เก็บ "' + name + '" แล้ว' + (j.preset ? ' · ใช้ตัดคลิปได้ในชื่อ ' + j.preset : ''); $('startMsg').className = 'msg ok'; load();
      } catch (e) { fail(e); }
    };
  } else {
    el.querySelectorAll('.ph img').forEach((im, k) => im.src = pic(x.frames[k]));
    if (x.command) {
      act.innerHTML = '<code></code><div class="row" style="margin-top:6px"><button class="go">คัดลอกคำสั่งให้ Claude</button><button>ตรวจอีกครั้ง</button></div>';
      act.querySelector('code').textContent = x.command;
      act.querySelector('.go').onclick = e => copy(x.command, e.target);
      act.querySelectorAll('button')[1].onclick = load;
    } else {
      act.innerHTML = '<button class="go">ทำพรีวิว</button>';
      act.querySelector('button').onclick = async e => {
        e.target.disabled = true;
        try { await api('/api/style/preview', {folder: x.folder}); load(); } catch (err) { fail(err); e.target.disabled = false; }
      };
    }
  }
  return el;
}
function mineCard(x, shareable) {
  const el = document.createElement('div');
  el.className = 'item';
  el.innerHTML = (x.gif ? '<img class="pv">' : '<div class="ph"></div>') + '<div class="b"><div class="t"></div><div class="msg"></div></div>';
  if (x.gif) { const img = el.querySelector('img.pv'); let still = false; img.src = pic(x.gif); img.onclick = () => { still = !still; img.src = pic(still ? x.png : x.gif); }; }
  el.querySelector('.t').textContent = x.name;
  el.querySelector('.msg').textContent = x.about;
  if (shareable) {
    const b = document.createElement('button'); b.textContent = 'ส่งขออนุมัติให้ทีม'; b.style.alignSelf = 'flex-start';
    const tip = document.createElement('span'); tip.className = 'msg';
    b.onclick = async () => {
      try {
        const j = await api('/api/style/share', {preset: x.name});
        window.open(j.url, '_blank');
        tip.textContent = 'เปิดหน้า GitHub แล้ว ลากไฟล์นี้ใส่ก่อนกดส่ง: ' + j.gif; tip.className = 'msg ok';
      } catch (e) { tip.textContent = '❌ ' + ckErr(e); tip.className = 'msg bad'; }
    };
    el.querySelector('.b').append(b, tip);
  }
  return el;
}
async function load() {
  try {
    const j = await api('/api/style/items');
    $('lab').innerHTML = j.items.length ? '' : '<div class="empty">ยังไม่มี · เลือกโปรเจกต์หรือวิดีโอด้านบน</div>';
    // projects whose normal line matches are one style; each different look inside it is a variant to keep or skip
    const groups = new Map();
    j.items.forEach(x => { const k = x.family ? 'f:' + x.family : 'i:' + x.folder; groups.set(k, [...(groups.get(k) || []), x]); });
    groups.forEach(rows => {
      if (rows.length === 1) return $('lab').appendChild(card(rows[0]));
      const variants = new Map();
      rows.forEach(x => variants.set(x.look, [...(variants.get(x.look) || []), x]));
      const box = document.createElement('div'), h = document.createElement('h3'), g = document.createElement('div');
      box.className = 'family'; g.className = 'grid';
      h.textContent = `สไตล์เดียวกันจาก ${rows.length} โปรเจกต์ · ${variants.size} แบบย่อย`;
      variants.forEach(same => {
        const el = card(same[0]);
        if (same.length > 1) {
          const n = document.createElement('span'); n.className = 'msg';
          n.textContent = 'หน้าตาเหมือนกัน: ' + same.slice(1).map(x => x.name).join(', ');
          el.querySelector('.tag').after(n);
        }
        g.appendChild(el);
      });
      box.append(h, g); $('lab').appendChild(box);
    });
    const c = j.collection;
    $('mine').innerHTML = '';
    [['พร้อมใช้ตัดคลิป (preset)', c.presets, true], ['สไตล์ทีม (อนุมัติแล้ว)', c.team], ...Object.keys(CATS).map(k => [CATS[k], c.parts[k]])].forEach(([title, rows, shareable]) => {
      const h = document.createElement('h3'); h.textContent = `${title} · ${rows.length}`; $('mine').appendChild(h);
      const g = document.createElement('div'); g.className = 'grid';
      if (!rows.length) g.innerHTML = '<div class="empty">ยังไม่มี</div>';
      rows.forEach(x => g.appendChild(mineCard(x, shareable)));
      $('mine').appendChild(g);
    });
    const opts = (k, none) => (none ? `<option value="">${none}</option>` : '') + c.parts[k].map(p => `<option>${p.name}</option>`).join('');
    $('mMain').innerHTML = c.parts.main.length ? opts('main') : '<option value="">ยังไม่มีซับปกติ + คำเน้น</option>';
    $('mCaption').innerHTML = opts('caption', 'ไม่มีซับสำหรับอ่าน');
    $('mSecond').innerHTML = opts('second', 'ไม่มีประโยคเอียง');
  } catch (e) { $('lab').textContent = '❌ ' + ckErr(e); }
}
$('mGo').onclick = async () => {
  const m = $('mMsg');
  try {
    if (!$('mMain').value) throw new Error('ต้องมีซับปกติ + คำเน้นก่อน');
    if (!$('mName').value.trim()) throw new Error('ตั้งชื่อก่อน');
    const j = await api('/api/style/compose', {name: $('mName').value.trim(), main: $('mMain').value,
      caption: $('mCaption').value || null, second: $('mSecond').value || null});
    m.textContent = '✓ สร้างแล้ว ' + j.preset; m.className = 'msg ok'; load();
  } catch (e) { m.textContent = '❌ ' + ckErr(e); m.className = 'msg bad'; }
};
$('proj').onchange = () => setSrc($('proj').value);
$('pick').onclick = async () => {
  try { const j = await api('/api/kit/pick', {}); if (j.path) { $('proj').value = ''; setSrc(j.path); } } catch (e) { $('startMsg').textContent = '❌ ' + ckErr(e); }
};
$('go').onclick = async () => {
  $('go').disabled = true; $('startMsg').textContent = 'กำลังถอด…'; $('startMsg').className = 'msg';
  try {
    const j = await api('/api/style/start', {source: SRC});
    $('startMsg').textContent = j.status === 'ready' ? '✓ ถอดแล้ว ดูพรีวิวด้านล่าง' : '✓ ดึงเฟรมแล้ว คัดลอกคำสั่งให้ Claude ถอดต่อ';
    $('startMsg').className = 'msg ok'; load();
  } catch (e) { $('startMsg').textContent = '❌ ' + ckErr(e); $('startMsg').className = 'msg bad'; }
  $('go').disabled = !SRC;
};
api('/api/style/capcut-projects').then(j => j.projects.forEach(p => {
  const o = document.createElement('option'); o.value = p.path; o.textContent = p.name; $('proj').appendChild(o);
})).catch(e => { $('startMsg').textContent = '❌ ' + ckErr(e); $('startMsg').className = 'msg bad'; });
load();
</script>
<script src="/shell.js?v=12"></script>
</body>
</html>
