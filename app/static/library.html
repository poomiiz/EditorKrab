<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>คลังอนิเมชัน</title>
<style>
:root{--bg:#0e0f12;--card:#16171b;--card2:#1d1f24;--line:#2a2c33;--txt:#ececf1;--sub:#c9cbd3;--mut:#8b8d98;--acc:#6c4cf0;--ok:#10b981;--warn:#f59e0b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 "Segoe UI","Leelawadee UI",system-ui,sans-serif}
main{max-width:1200px;margin:0 auto;padding:22px 18px 60px}
h1{font-size:18px;font-weight:600;margin:0 0 4px}.sub{color:var(--mut);font-size:14px;margin:0 0 16px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.bar b{color:var(--mut);font-size:13px;font-weight:600;margin-right:4px}
.chip{background:var(--card2);color:var(--sub);border:1px solid var(--line);border-radius:99px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
input[type=search]{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:6px 10px;font:inherit;min-width:220px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:14px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.item{position:relative}.item.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.item .pv{width:100%;aspect-ratio:3/4;background:#000;display:grid;place-items:center;color:var(--mut);font-size:13px;overflow:hidden;position:relative}
.item .pv video,.item .pv img{width:100%;height:100%;object-fit:contain}
.item .pv iframe{position:absolute;left:50%;top:0;width:1080px;height:1920px;border:0;transform-origin:0 0;pointer-events:none}
.item .pick{position:absolute;top:8px;left:8px;width:20px;height:20px;accent-color:var(--acc);cursor:pointer;z-index:2}
.selbar{position:sticky;top:0;z-index:5;background:var(--card);border:1px solid var(--acc);border-radius:12px;padding:10px 14px;display:none;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.selbar button{border:0;border-radius:8px;padding:7px 14px;font:inherit;font-weight:600;cursor:pointer}
.selbar .del{background:#e5484d;color:#fff}.selbar .no{background:var(--card2);color:var(--sub)}
.item .b{padding:10px 12px;display:flex;flex-direction:column;gap:5px;flex:1}
.item .t{font-weight:700;font-size:14px}
.item .d{color:var(--mut);font-size:12.5px;line-height:1.4;flex:1}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--card2);color:var(--sub)}
.tag.ours{background:#0f9d76;color:#fff}.tag.warn{background:rgba(245,158,11,.15);color:var(--warn)}
button.act{background:var(--card2);color:var(--sub);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:inherit;font-size:12.5px;cursor:pointer}
button.act:hover{border-color:var(--acc);color:#fff}
.new{background:linear-gradient(120deg,#2a1f63,#1a2a4a);border:1px solid #3b3480;border-radius:14px;padding:16px;margin:16px 0;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.new select{background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit}
.new button{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
code{display:block;margin-top:8px;padding:8px 10px;background:#080a10;border-radius:8px;font-size:13px;word-break:break-all;width:100%}
.count{color:var(--mut);font-size:13px}
</style>
<link rel="stylesheet" href="/shell.css?v=9">
<script src="/ui.js?v=3"></script></head>
<body>
<main>
  <h1>✨ คลังอนิเมชัน</h1>
  <p class="sub">เทมเพลตของเรา (ใช้ได้ทันที) และคลังสำเร็จรูปของ HyperFrames แยกตามหน้าที่และอารมณ์ · อยากได้ท่าใหม่ ให้ Claude สร้างโดยดูจากคลังนี้ไม่ให้ซ้ำ</p>

  <div class="new" id="newBox" style="display:none">
    <b>สร้างท่าใหม่</b>
    <select id="nRole"></select>
    <select id="nMood"></select>
    <button id="nGo">คัดลอกคำสั่งให้ Claude</button>
    <code id="nCmd" style="display:none"></code>
  </div>

  <div class="bar"><b>แหล่ง</b><span id="fSrc"></span></div>
  <div class="bar"><b>ใช้ทำ</b><span id="fRole"></span></div>
  <div class="bar"><b>อารมณ์</b><span id="fMood"></span></div>
  <div class="bar"><input type="search" id="q" placeholder="ค้นชื่อหรือคำอธิบาย"><span class="count" id="count"></span>
    <button class="act" id="unhide" style="display:none"></button></div>
  <div class="selbar" id="selbar"><b id="selN"></b><button class="del" id="selDel">ลบที่เลือก</button><button class="no" id="selNo">ยกเลิก</button>
    <span class="count">สไตล์ของฉันลบไฟล์จริง · ของในคลังกลางแค่ซ่อนจากเครื่องนี้</span></div>
  <div class="grid" id="grid"></div>
</main>
<script>
const $ = id => document.getElementById(id);
let ALL = [], F = {src: 'ทั้งหมด', role: 'ทั้งหมด', mood: 'ทั้งหมด'};
const ROLES = ['หัวคลิป', 'คำเน้น', 'ซับ', 'ป้ายชื่อ', 'ตัวเลข/ข้อมูล', 'โซเชียล', 'ทรานสิชัน', 'บรรยากาศ', 'ปก', 'อื่น ๆ'];
const MOODS = ['ทางการ', 'เล่าเรื่อง', 'ตื่นเต้น', 'ตลก/โซเชียล', 'ทั่วไป'];
function chips(box, key, list) {
  $(box).innerHTML = ['ทั้งหมด', ...list].map(v => `<button class="chip${F[key] === v ? ' on' : ''}" data-v="${v}">${v}</button>`).join('');
  $(box).querySelectorAll('button').forEach(b => b.onclick = () => { F[key] = b.dataset.v; draw(); });
}
function copy(text, btn) { navigator.clipboard.writeText(text).then(() => { const t = btn.textContent; btn.textContent = '✓ คัดลอกแล้ว'; setTimeout(() => btn.textContent = t, 1500); }); }
const SRC = x => x.source || 'hyperframes';
const KEY = x => SRC(x) + ':' + x.name;
const SEL = new Set();
// previews move only while on screen, so a page of 120 items stays light
const seen = new IntersectionObserver(es => es.forEach(e => {
  const v = e.target.querySelector('video');
  if (v) e.isIntersecting ? v.play().catch(() => {}) : v.pause();
  const f = e.target.querySelector('iframe[data-src]');
  if (f && e.isIntersecting) { f.src = f.dataset.src; f.removeAttribute('data-src'); }
}), {rootMargin: '200px'});
function preview(x) {
  const box = document.createElement('div'); box.className = 'pv';
  if (x.gif) { const i = document.createElement('img'); i.loading = 'lazy'; i.src = x.gif; box.appendChild(i); }
  else if (x.preview) { const v = document.createElement('video'); v.src = x.preview; v.muted = v.loop = v.playsInline = true; v.preload = 'metadata'; box.appendChild(v); }
  else if (SRC(x) === 'clipkit') {   // our templates have no rendered clip: play the template page itself, shrunk
    const f = document.createElement('iframe'); f.tabIndex = -1;
    f.dataset.src = '/motion/' + x.name + '/index.html' + (x.bg ? '?bg=preview-bg.jpg' : '');
    f.onload = () => {   // the template stays paused for the renderer: loop its timeline here, as the motion page does
      const tl = f.contentWindow.__timelines && f.contentWindow.__timelines.main;
      if (tl) tl.repeat(-1).repeatDelay(0.6).play(0);
    };
    box.appendChild(f);
    requestAnimationFrame(() => { f.style.transform = `scale(${box.clientHeight / 1920}) translateX(-50%)`; });
  } else box.textContent = 'ไม่มีตัวอย่าง';
  return box;
}
function selbar() {
  $('selbar').style.display = SEL.size ? 'flex' : 'none';
  $('selN').textContent = `เลือก ${SEL.size} ชิ้น`;
}
async function post(url, body) {
  const r = await fetch(url, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  return r.json();
}
$('selNo').onclick = () => { SEL.clear(); selbar(); draw(); };
$('selDel').onclick = async () => {
  const rows = ALL.filter(x => SEL.has(KEY(x)));
  const own = rows.filter(x => x.own), hide = rows.filter(x => !x.own);
  if (!await ckConfirm(`ลบ ${rows.length} ชิ้น?` + (own.length ? `\nสไตล์ของฉัน ${own.length} ชิ้นจะถูกลบไฟล์ทิ้ง กู้คืนไม่ได้` : ''), {ok: 'ลบ', danger: true})) return;
  try {
    for (const x of own) await post('/api/style/remove', {preset: x.name});
    if (hide.length) await post('/api/kit/library/hide', {keys: hide.map(KEY)});
  } catch (e) { ckAlert('ลบไม่สำเร็จ: ' + ckErr(e)); }
  SEL.clear(); selbar(); load();
};
$('unhide').onclick = () => post('/api/kit/library/hide', {keys: [], restore: true}).then(load);
function draw() {
  chips('fSrc', 'src', ['ของเรา', 'สไตล์ซับ', 'HyperFrames']);
  chips('fRole', 'role', ROLES);
  chips('fMood', 'mood', MOODS);
  const q = $('q').value.trim().toLowerCase();
  const src = {'ของเรา': 'clipkit', 'สไตล์ซับ': 'style', 'HyperFrames': 'hyperframes'}[F.src];
  const rows = ALL.filter(x => (F.src === 'ทั้งหมด' || SRC(x) === src)
    && (F.role === 'ทั้งหมด' || x.role === F.role) && (F.mood === 'ทั้งหมด' || x.mood === F.mood)
    && (!q || (x.name + ' ' + (x.title || '') + ' ' + (x.description || '')).toLowerCase().includes(q)));
  $('count').textContent = rows.length + ' ชิ้น';
  $('grid').innerHTML = '';
  rows.slice(0, 120).forEach(x => {
    const el = document.createElement('div');
    el.className = 'item' + (SEL.has(KEY(x)) ? ' sel' : '');
    const ours = SRC(x) === 'clipkit', style = SRC(x) === 'style';
    el.innerHTML = `<div class="b"><div class="t"></div><div class="tags">${ours ? '<span class="tag ours">ของเรา</span>' : ''}${style ? `<span class="tag ours">${x.own ? 'สไตล์ของฉัน' : 'สไตล์ทีม'}</span>` : ''}<span class="tag">${x.role}</span>${x.mood ? `<span class="tag">${x.mood}</span>` : ''}` +
      `${x.thai === 'test' ? '<span class="tag warn">ต้องลองคำไทย</span>' : ''}${x.vertical === 'adapt' ? '<span class="tag warn">ปรับแนวตั้ง</span>' : ''}</div>` +
      `<div class="d"></div><div style="display:flex;gap:6px"></div></div>`;
    el.querySelector('.t').textContent = x.title || x.name;
    el.querySelector('.d').textContent = x.description || (ours ? 'ใช้ได้จากหน้าตัวหนังสือเคลื่อนไหว / ทำปก' : '');
    const acts = el.querySelector('.b > div:last-child');
    if (ours) {
      const b = document.createElement('button'); b.className = 'act'; b.textContent = 'ดูตัวอย่าง';
      b.onclick = () => window.open('/motion/' + x.name + '/index.html', '_blank'); acts.appendChild(b);
    } else if (CAN && !style) {
      const b = document.createElement('button'); b.className = 'act'; b.textContent = 'ให้ Claude ทำเป็นเทมเพลตของเรา';
      b.onclick = () => copy(`EditorKrab: ทำเทมเพลตจาก HyperFrames "${x.name}"`, b); acts.appendChild(b);
    }
    el.prepend(preview(x));
    const pick = document.createElement('input'); pick.type = 'checkbox'; pick.className = 'pick'; pick.title = 'เลือกเพื่อลบ';
    pick.checked = SEL.has(KEY(x));
    pick.onchange = () => { pick.checked ? SEL.add(KEY(x)) : SEL.delete(KEY(x)); el.classList.toggle('sel', pick.checked); selbar(); };
    el.prepend(pick);
    $('grid').appendChild(el);
    seen.observe(el);
  });
}
$('nRole').innerHTML = ROLES.filter(r => r !== 'อื่น ๆ').map(r => `<option>${r}</option>`).join('');
$('nMood').innerHTML = MOODS.filter(m => m !== 'ทั่วไป').map(m => `<option>${m}</option>`).join('');
$('nGo').onclick = () => {
  const cmd = `EditorKrab: สร้างท่าใหม่ ใช้ทำ "${$('nRole').value}" อารมณ์ "${$('nMood').value}"`;
  $('nCmd').textContent = cmd; $('nCmd').style.display = 'block'; copy(cmd, $('nGo'));
};
$('q').addEventListener('input', draw);
let CAN = false;
function load() {
  fetch('/api/kit/library').then(r => r.json()).then(j => {
    CAN = j.can_create; $('newBox').style.display = CAN ? '' : 'none';
    ALL = [...j.ours, ...(j.styles || []), ...j.hyperframes];
    $('unhide').style.display = j.hidden ? '' : 'none'; $('unhide').textContent = `แสดงที่ซ่อนไว้ (${j.hidden})`;
    draw();
  }).catch(e => { $('grid').textContent = '❌ ' + ckErr(e); });
}
load();
</script>
<script src="/shell.js?v=13"></script>
</body>
</html>
