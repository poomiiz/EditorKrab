<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ทำตัวหนังสือเคลื่อนไหว</title>
<style>
:root{--bg:#0e0f12;--card:#16171b;--card2:#1d1f24;--line:#2a2c33;--txt:#ececf1;--sub:#c9cbd3;--mut:#8b8d98;--acc:#6c4cf0;--acc2:#38bdf8;--ok:#10b981;--bad:#ef4444}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.6 "Segoe UI","Leelawadee UI",system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:24px 16px 60px;display:grid;grid-template-columns:1fr 340px;gap:20px}
@media (max-width:760px){main{grid-template-columns:1fr}}
.top{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}
h1{font-size:18px;font-weight:600;margin:0}
a{color:var(--acc2);text-decoration:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
label{display:block;color:var(--sub);font-size:14px;margin:12px 0 4px}
.hint{color:var(--mut);font-size:13px}
input,select,textarea{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 10px;font:inherit}
textarea{min-height:120px}
.row{display:flex;gap:8px}.row>*{flex:1}
button{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:7px 14px;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer}
button.ghost{background:var(--card2);color:var(--sub);border:1px solid var(--line)}
button:disabled{opacity:.5;cursor:wait}
.big{width:100%;margin-top:16px;padding:14px;font-size:16px}
.msg{margin-top:10px;font-size:14px;word-break:break-all}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.preview{position:sticky;top:16px;aspect-ratio:9/16;border-radius:14px;border:1px solid var(--line);overflow:hidden;
  background:repeating-conic-gradient(#2a3042 0 25%,#1f2433 0 50%) 0 0/24px 24px}
.preview iframe{position:absolute;left:0;top:0;width:1080px;height:1920px;border:0;transform-origin:0 0;pointer-events:none}
.preview .tag{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:3px 8px;border-radius:99px}
[hidden]{display:none!important}
</style>
<link rel="stylesheet" href="/shell.css?v=9">
<script src="/ui.js?v=3"></script></head>
<body>
<main>
  <div class="top"><h1>🔤 ตัวหนังสือเคลื่อนไหว</h1></div>
  <div class="card">
    <label for="tpl">แบบ</label>
    <select id="tpl"></select>
    <div id="fields"></div>

    <label for="speed">ความเร็ว <span class="hint">(2 = เร็วกว่าต้นฉบับ CapCut เท่าตัว · 1 = เท่าต้นฉบับ)</span></label>
    <input id="speed" type="number" min="0.5" max="5" step="0.5" value="2">
    <label for="name">ชื่อไฟล์</label><input id="name" placeholder="เช่น ep07_hook">
    <button class="big" id="go">ทำไฟล์พื้นใส (.mov) ไปวางใน CapCut</button>
    <div class="msg" id="msg"></div>
  </div>
  <div class="preview" id="pv"><iframe id="live" title="ตัวอย่าง"></iframe><span class="tag" id="pvTag">ตัวอย่างสด · เล่นวนซ้ำ</span></div>
</main>
<script>
const $ = id => document.getElementById(id);
// installed fonts for the font pickers; the last choice is remembered on this machine
let FONTS = [];
const fontsReady = fetch('/api/kit/fonts').then(r => r.json()).then(j => FONTS = j.fonts || []).catch(() => FONTS = []);
const fontOptions = sel => '<option value="">ตามเทมเพลต</option>' + FONTS.map(f =>
  `<option${f === sel ? ' selected' : ''}>${f.replace(/</g, '&lt;')}</option>`).join('');
const savedFont = () => { try { return localStorage.getItem('ck_font') || ''; } catch { return ''; } };
const keepFont = v => { try { localStorage.setItem('ck_font', v); } catch {} };
// the form comes from each template's <script id="clipkit-motion"> spec (GET /api/kit/motion-templates)
let SPECS = {};
const spec = () => SPECS[$('tpl').value];
function drawFields() {
  $('fields').innerHTML = spec().fields.map(f => {
    const id = 'f_' + f.key;
    if (f.type === 'select') return `<label>${f.label}</label><select id="${id}">${f.options.map(([v, t]) =>
      `<option value="${v}"${v === f.default ? ' selected' : ''}>${t}</option>`).join('')}</select>`;
    if (f.type === 'font') return `<label>${f.label}</label><select id="${id}" onchange="keepFont(this.value)">${fontOptions(savedFont())}</select>`;
    if (f.type === 'pairs') return `<label>${f.label}</label><textarea id="${id}">${f.default || ''}</textarea>
      <label>แต่ละคู่โชว์กี่วินาที</label><input id="${id}_each" type="number" min="1" step="0.5" value="${f.each || 2.5}">`;
    return `<label>${f.label}</label><input id="${id}" ${f.type === 'number' ? 'type="number" step="0.5"' : ''} value="${f.default ?? ''}">`;
  }).join('');
  $('fields').querySelectorAll('input,select,textarea').forEach(e => e.addEventListener('input', refresh));
}
function params() {
  const out = {speed: parseFloat($('speed').value) || 2};
  for (const f of spec().fields) {
    const v = $('f_' + f.key).value;
    if (f.type === 'pairs') {
      const each = parseFloat($('f_' + f.key + '_each').value) || 2.5;
      // punch lands right after the white line finishes typing (original edit 0.6-1.0 s)
      out[f.key] = v.split(/\r?\n/).map(x => x.trim()).filter(Boolean).map((l, i) => {
        const [lead, punch = ''] = l.split('/').map(x => x.trim());
        return [i * each, (i + 1) * each, lead, punch, f.delay ?? 0.8];
      });
    } else out[f.key] = f.type === 'number' ? parseFloat(v) || f.default : v.trim();
  }
  return out;
}
function fitFrame() { $('live').style.transform = `scale(${$('pv').clientWidth / 1080})`; }
window.addEventListener('resize', fitFrame);
// preview: load the real template, then play its timeline on a loop (the template itself stays paused for the renderer)
let timer = 0;
function refresh() {
  clearTimeout(timer);
  timer = setTimeout(() => {
    const p = params(), q = new URLSearchParams();
    for (const [k, v] of Object.entries(p)) q.set(k, typeof v === 'object' ? JSON.stringify(v) : v);
    const f = $('live');
    f.onload = () => {
      const tl = f.contentWindow.__timelines && f.contentWindow.__timelines.main;
      if (tl) tl.repeat(-1).repeatDelay(0.6).play(0);
    };
    f.src = '/motion/' + $('tpl').value + '/index.html?' + q;
    fitFrame();
  }, 300);
}
$('speed').addEventListener('input', refresh);
$('tpl').addEventListener('input', () => { drawFields(); refresh(); });
$('go').onclick = async () => {
  const b = $('go'); b.disabled = true; $('msg').className = 'msg'; $('msg').textContent = 'กำลังทำไฟล์… (ประมาณ 20–40 วินาที)';
  try {
    const r = await fetch('/api/kit/motion', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({template: $('tpl').value, name: $('name').value.trim() || $('tpl').value, params: params()})});
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.detail || r.statusText);
    $('msg').className = 'msg ok'; $('msg').textContent = '✅ บันทึกแล้ว: ' + j.file;
  } catch (e) { $('msg').className = 'msg bad'; $('msg').textContent = '❌ ' + ckErr(e); }
  b.disabled = false;
};
Promise.all([fetch('/api/kit/motion-templates').then(r => r.json()), fontsReady]).then(([j]) => {
  SPECS = j.templates;
  $('tpl').innerHTML = Object.entries(SPECS).map(([k, v]) => `<option value="${k}">${v.label}</option>`).join('');
  drawFields(); refresh();
}).catch(e => { $('msg').className = 'msg bad'; $('msg').textContent = '❌ โหลดรายชื่อเอฟเฟกต์ไม่ได้: ' + ckErr(e); });
</script>
<script src="/shell.js?v=13"></script>
</body>
</html>
